<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Frankyoel</title>
  <desc id="desc">Encabezado oscuro con una aurora morada, azul y verde. Desarrollo web y móvil, Linux y aprendizaje continuo.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#100d25"/><stop offset="1" stop-color="#081726"/></linearGradient>
    <linearGradient id="aurora"><stop stop-color="#a46cff"/><stop offset=".5" stop-color="#507cff"/><stop offset="1" stop-color="#46d9ba"/></linearGradient>
    <filter id="blur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="25"/></filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <path d="M-80 300 C190 390 350 130 620 220 S1000 50 1300 110" fill="none" stroke="url(#aurora)" stroke-width="95" opacity=".34" filter="url(#blur)"/>
    <path d="M-80 320 C200 380 360 150 640 230 S1000 60 1280 100" fill="none" stroke="url(#aurora)" stroke-width="2" opacity=".52"/>
    <g fill="#c9d4ff" opacity=".5"><circle cx="104" cy="62" r="1.6"/><circle cx="267" cy="89" r="1"/><circle cx="526" cy="45" r="1.5"/><circle cx="771" cy="66" r="1"/><circle cx="1087" cy="56" r="1.4"/><circle cx="1129" cy="269" r="1"/><circle cx="84" cy="201" r="1"/></g>
    <text x="600" y="105" text-anchor="middle" fill="#b8c4f7" font-family="Arial, sans-serif" font-size="16" letter-spacing="5">HOLA, SOY</text>
    <text x="600" y="183" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="700" font-size="68" letter-spacing="-2">Frankyoel</text>
    <text x="600" y="225" text-anchor="middle" fill="#d3daf4" font-family="Arial, sans-serif" font-size="21">Desarrollo web y móvil · Linux · Aprendizaje continuo</text>
    <rect x="566" y="258" width="68" height="3" rx="1.5" fill="url(#aurora)"/>
  </g>
</svg>
